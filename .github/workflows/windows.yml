name: Windows tests and executable
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Audio processing, simulated streams, and real Tk widget tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --onedir --windowed --name MicBoost main.py
      - name: Check packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\MicBoost\MicBoost.exe" -ArgumentList "--self-test" -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "Packaged executable timed out"
          }
          if ($process.ExitCode -ne 0) { throw "Packaged executable failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: MicBoost-Windows
          path: |
            dist/MicBoost/
            WINDOWS_GUIDE.md
            WINDOWS_SECURITY.md
          if-no-files-found: error
