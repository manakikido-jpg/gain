name: Windows tests and executable
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Audio processing, simulated streams, and real Tk widget tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name MicBoost main.py
      - uses: actions/upload-artifact@v4
        with:
          name: MicBoost-Windows
          path: |
            dist/MicBoost.exe
            WINDOWS_GUIDE.md
          if-no-files-found: error
